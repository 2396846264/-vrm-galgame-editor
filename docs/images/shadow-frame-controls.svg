<svg xmlns="http://www.w3.org/2000/svg" width="800" height="252" viewBox="0 0 800 252" role="img" aria-label="阴影高度和动作定格帧功能示意图">
  <rect width="800" height="252" rx="20" fill="#f3f6f4"/>
  <rect x="20" y="20" width="370" height="212" rx="16" fill="#fff" stroke="#dce6e1"/>
  <rect x="410" y="20" width="370" height="212" rx="16" fill="#fff" stroke="#dce6e1"/>
  <g fill="#22362e" font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif">
    <text x="42" y="60" font-size="22" font-weight="700">角色阴影</text>
    <text x="432" y="60" font-size="22" font-weight="700">动作定格帧</text>
    <text x="42" y="99" font-size="16">阴影水平高度</text>
    <text x="432" y="99" font-size="16">选择第几帧</text>
    <text x="42" y="188" font-size="15" fill="#63766c">全场角色一起调，右移抬高</text>
    <text x="432" y="188" font-size="15" fill="#63766c">拖动滑块，也能直接输入数字</text>
  </g>
  <path d="M42 133H265M432 133H655" stroke="#d6e2dc" stroke-width="10" stroke-linecap="round"/>
  <path d="M42 133H189M432 133H502" stroke="#158866" stroke-width="10" stroke-linecap="round"/>
  <circle cx="189" cy="133" r="12" fill="#158866"/>
  <circle cx="502" cy="133" r="12" fill="#158866"/>
  <g fill="#158866" font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">
    <text x="288" y="139">+13 cm</text>
    <text x="677" y="139">40 / 118</text>
  </g>
</svg>
