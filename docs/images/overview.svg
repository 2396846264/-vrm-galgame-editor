  </g>
  <g fill="#53668c"><rect x="921" y="279" width="192" height="6" rx="3"/><rect x="921" y="334" width="192" height="6" rx="3"/><rect x="921" y="389" width="192" height="6" rx="3"/><rect x="921" y="444" width="192" height="6" rx="3"/></g>
  <g fill="#a69bff"><circle cx="1014" cy="282" r="7"/><circle cx="1064" cy="337" r="7"/><circle cx="987" cy="392" r="7"/><circle cx="965" cy="447" r="7"/></g>
  <rect x="56" y="501" width="1088" height="113" rx="13" fill="#1d2a44"/>
  <text x="76" y="531" fill="#dde8ff" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700">剧情时间线</text>
  <line x1="95" y1="564" x2="1119" y2="564" stroke="#647797" stroke-width="3"/>
  <g fill="#a39afe"><circle cx="178" cy="564" r="10"/><circle cx="433" cy="564" r="10"/><circle cx="688" cy="564" r="10"/><circle cx="955" cy="564" r="10"/></g>
  <g font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="14" fill="#b9c7df"><text x="138" y="594">背景</text><text x="392" y="594">人物登场</text><text x="655" y="594">对白</text><text x="922" y="594">音乐</text></g>
  <text x="1145" y="657" text-anchor="end" fill="#94a4c5" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="13">功能示意图 / feature illustration</text>
