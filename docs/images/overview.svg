  <rect x="903" y="188" width="241" height="298" rx="13" fill="#1d2a44"/>
  <text x="922" y="221" fill="#dde8ff" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">人物与画面</text>
  <g font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="15" fill="#b7c5d9">
