    <text x="76" y="265">▸ 第一幕 · 相遇</text><text x="76" y="305">▸ 第二幕 · 选择</text><text x="76" y="345">▸ 角色</text><text x="76" y="385">▸ 背景与音频</text><text x="76" y="425">▸ 动作与表情</text>
  </g>
  <rect x="278" y="188" width="609" height="298" rx="13" fill="url(#stage)"/>
  <circle cx="679" cy="265" r="73" fill="#f5d6c5" opacity=".18"/>
  <path d="M279 425q170-98 306-25t302-49v135H278z" fill="#1e335a" opacity=".7"/>
  <path d="M486 330c-24-28-39-63-29-85 6-17 23-29 47-35 27-25 72-20 88 12 18 25 6 61-19 89l-24 37z" fill="#25324d"/>
