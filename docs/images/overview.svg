<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">VRM Galgame 编辑器功能示意图</title>
  <desc id="desc">左侧是工程、角色与素材，中央是三维人物舞台，右侧是角色属性，下方是对白时间线。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#202a52"/></linearGradient>
    <linearGradient id="stage" x2="0" y2="1"><stop stop-color="#365b88"/><stop offset="1" stop-color="#9885a2"/></linearGradient>
    <linearGradient id="coat" x2="1" y2="1"><stop stop-color="#6f6bd8"/><stop offset="1" stop-color="#332f75"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="60" r="190" fill="#7583ee" opacity=".09"/>
  <text x="46" y="57" fill="#f8fafc" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-weight="700" font-size="29">VRM Galgame Editor</text>
  <text x="47" y="87" fill="#b6c5dc" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="16">角色 · 剧情 · 声画 · 导出</text>
  <rect x="40" y="112" width="1120" height="520" rx="19" fill="#121b32" stroke="#61749c" filter="url(#shadow)"/>
  <path d="M59 112h1082a19 19 0 0 1 19 19v40H40v-40a19 19 0 0 1 19-19z" fill="#253451"/>
  <circle cx="69" cy="142" r="7" fill="#fb7185"/><circle cx="91" cy="142" r="7" fill="#fbbf24"/><circle cx="113" cy="142" r="7" fill="#34d399"/>
  <text x="151" y="148" fill="#edf2ff" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="17">我的 VRM 故事</text>
  <rect x="982" y="126" width="150" height="31" rx="15" fill="#907dff"/>
  <text x="1057" y="147" text-anchor="middle" fill="white" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="15">▶ 试玩 / 导出</text>
  <rect x="56" y="188" width="206" height="298" rx="13" fill="#1d2a44"/>
  <text x="74" y="221" fill="#dde8ff" font-family="Segoe UI,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">工程</text>
