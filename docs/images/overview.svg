  <path d="M478 268q23-58 96-45 21 22 9 46-27-19-45-22-26 29-60 21z" fill="#25324d"/>
  <path d="M500 343q-76 19-97 143h249q-21-123-95-143z" fill="url(#coat)"/>
  <path d="M525 344l-21 76 23 34 26-34-20-76z" fill="#f3d7db"/>
  <ellipse cx="527" cy="475" rx="117" ry="12" fill="#071327" opacity=".35"/>
