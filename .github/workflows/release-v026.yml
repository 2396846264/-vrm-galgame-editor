name: Publish tested Windows release 0.0.26

on:
  push:
    branches: [main]
    paths: ['.github/releases/v0.0.26.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0.0.26
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct locally tested package and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/assemble-release-delta.mjs .github/releases/v0.0.26.json
      - name: Publish Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing releases.' }
          if ($existing -contains 'v0.0.26') { throw 'Version 0.0.26 already exists; refusing to overwrite a release.' }
          gh release create v0.0.26 VRMGalgame-0.0.26-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "0.0.26 · 编辑界面布局优化" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
