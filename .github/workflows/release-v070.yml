name: Publish tested Windows release 0.0.70
on:
  push:
    branches: [main]
    paths: ['.github/releases/v0.0.70.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v0.0.70
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful public source checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-public-source.mjs .github/releases/v0.0.70.json
      - name: Reconstruct the exact tested program and examples
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/assemble-release.mjs .github/releases/v0.0.70.json
          if($LASTEXITCODE -ne 0){throw 'Program reconstruction failed'}
          node scripts/assemble-release.mjs .github/releases/v0.0.70-examples.json
          if($LASTEXITCODE -ne 0){throw 'Example reconstruction failed'}
      - name: Verify application integrity and build installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath VRMGalgame-0.0.70-win-x64.zip -DestinationPath tested-package
          $package=(Resolve-Path tested-package/公民文艺生产综合自动化系统-0.0.70).Path
          $process=Start-Process -FilePath "$package/VRMGalgame.exe" -ArgumentList @('--check-package-integrity',('"'+$package+'"'),('"'+$package+'/integrity-check.json"')) -Wait -PassThru -WindowStyle Hidden
          if($process.ExitCode -ne 0){throw 'Application integrity check failed'}
          if(!(Get-Content "$package/integrity-check.json" -Raw | ConvertFrom-Json).ok){throw 'Application integrity check failed'}
          choco install innosetup --no-progress -y
          if($LASTEXITCODE -ne 0){throw 'Installer compiler installation failed'}
          $compiler=Get-ChildItem ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if(!$compiler){throw 'Installer compiler unavailable'}
          & $compiler "/DPackageRoot=$package" "/O$env:GITHUB_WORKSPACE/installer-output" scripts/windows-setup.iss
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
      - name: Publish installer, portable program, examples and illustrated guide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item -LiteralPath RELEASE_NOTES.md -Destination FEATURE_GUIDE.md
          $assets=@('installer-output/VRMGalgame-Setup-0.0.70.exe','VRMGalgame-0.0.70-win-x64.zip','VRMGalgame-0.0.70-Examples.zip','FEATURE_GUIDE.md')
          $lines=foreach($asset in $assets){if(!(Test-Path -LiteralPath $asset)){throw "Missing $asset"};(Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLower()+'  '+[IO.Path]::GetFileName($asset)}
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          $existing=gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName'
          if($LASTEXITCODE -ne 0){throw 'Cannot check releases'}
          if($existing -contains 'v0.0.70'){throw 'Release already exists'}
          gh release create v0.0.70 @assets SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '0.0.70 · 战舰编辑器、强制舰队与海空作战' --notes-file RELEASE_NOTES.md --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
